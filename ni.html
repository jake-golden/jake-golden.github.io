<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="National Instruments: analog design and characterization of a high-precision dual LCR meter and SMU inside NI's Semiconductor Test System (STS)." />
    <meta name="author" content="Jake Golden" />
    <title>National Instruments - Jake Golden</title>
    <script src="js/head.js"></script>
    <style>
      body { font-family: "Plus Jakarta Sans", sans-serif; }
      h1, h2, h3, h4, h5, h6 { font-family: "Arial Black", Arial, sans-serif; }
      /* ---- Banner logo, page-local -------------------------------------
         The NI mark is a compact 1.53:1 glyph rather than a wordmark, so it
         reads larger than the other project logos at the shared sizes. Each
         tier below is the shared .banner-logo size scaled to 90%. Kept local
         to this page so the other project banners are untouched.
         Paired with extra right-hand margin on .project-banner-content so the
         subtitle wraps before it reaches the logo (the logo is absolutely
         positioned, so it can't push the text on its own). Only the >=992px
         tiers need it — below that the shared rules already leave a wide gap. */
      @media (min-width: 1200px) {
        .banner-logo { min-width: 126px; max-width: 180px; }
        .project-banner-content { margin-right: 160px; max-width: calc(100% - 490px); }
      }
      @media (min-width: 992px) and (max-width: 1199px) {
        .banner-logo { min-width: 126px; max-width: 180px; }
        .project-banner-content { margin-right: 150px; max-width: calc(100% - 440px); }
      }
      @media (max-width: 991px) { .banner-logo { min-width: 99px; max-width: 135px; } }
      @media (max-width: 768px) { .banner-logo { min-width: 90px; max-width: 117px; } }
      @media (max-width: 600px) { .banner-logo { min-width: 81px; max-width: 108px; } }

      /* Placeholder while the writeup is being ported over from the ni1/ni2
         drafts. Sized so the page still fills the viewport below the banner
         instead of leaving the footer floating mid-screen. */
      .coming-soon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 46vh;
      }
      .coming-soon-box {
        max-width: 560px;
        padding: 3rem 2rem;
        text-align: center;
      }
      .coming-soon-box .cs-icon {
        font-size: 3rem;
        color: var(--text-muted);
        opacity: 0.55;
        display: block;
        margin-bottom: 1rem;
      }
      .coming-soon-box h2 { margin-bottom: 0.75rem; }
      .coming-soon-box p { margin-bottom: 0; }
    </style>
  </head>
  <body class="d-flex flex-column h-100" data-project="ni">
    <main class="flex-shrink-0">
      <div id="navbar-placeholder"></div>
      <script src="js/projects-data.js"></script>
      <script src="js/navbar.js"></script>

      <div id="banner-placeholder"></div>
      <script src="js/project-banner.js"></script>

      <section class="container px-5 mt-5 mb-5">
        <div class="coming-soon-wrap">
          <div class="content-box coming-soon-box">
            <i class="bi bi-cone-striped cs-icon"></i>
            <h2 class="fw-bolder">Coming Soon</h2>
            <p class="lead text-muted">I'm currently working on the writeup for this internship, check back soon!</p>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/scripts.js"></script>
  </body>
</html>
